name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default single commit: the check below
      # needs the last tag. It validates the commit subjects since that
      # tag and prints the tag the next release would get. It never
      # tags or releases; only the Release workflow does.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/next-version.sh --check | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: jdx/mise-action@v4
      - run: cd web && npm ci
      - run: make lint

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: cd web && npm ci
      - run: make build
      - run: make test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: cd web && npm ci
      - run: make web-test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: make smoke
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
